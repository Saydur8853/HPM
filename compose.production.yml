name: primehpm

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: primehpm-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env.production}"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env.production}"
      HPM_DB_PASSWORD: "${HPM_DB_PASSWORD:?set HPM_DB_PASSWORD in .env.production}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deployment/sql/init-db.sql:/scripts/init-db.sql:ro
    networks:
      - backend
    entrypoint: ["/bin/bash", "-c"]
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
      -v AppPassword="$$HPM_DB_PASSWORD" -i /scripts/init-db.sql

  app:
    build:
      context: .
      target: runtime
    container_name: primehpm-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DataProtection__KeyPath: /app/keys
      ConnectionStrings__HpmDatabase: "Server=db,1433;Database=HPM_Web;User ID=HpmApp;Password=${HPM_DB_PASSWORD:?set HPM_DB_PASSWORD in .env.production};Encrypt=True;TrustServerCertificate=True;Connect Timeout=15;Max Pool Size=128;Pooling=true"
      AllowedHosts: "${HPM_DOMAIN:?set HPM_DOMAIN in .env.production}"
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      - data_protection_keys:/app/keys
    networks:
      - frontend
      - backend
    logging:
      options:
        max-size: "20m"
        max-file: "10"

  caddy:
    image: caddy:2-alpine
    container_name: primehpm-caddy
    restart: unless-stopped
    environment:
      HPM_DOMAIN: "${HPM_DOMAIN:?set HPM_DOMAIN in .env.production}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - frontend
    logging:
      options:
        max-size: "20m"
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true

volumes:
  sql_data:
  data_protection_keys:
  caddy_data:
  caddy_config:
